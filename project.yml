name: Harbor
options:
  bundleIdPrefix: com.arjunakankipati.harbor
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 'TDBAHN96B3'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Harbor:
    type: application
    platform: iOS
    sources:
      - path: Harbor
      - path: assets/HarborIcon/Harbor.icon
    entitlements:
      path: Harbor/Harbor.entitlements
      properties:
        com.apple.developer.web-browser: true
    info:
      path: Harbor/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.arjunakankipati.harbor.tab-reorder
            UTTypeConformsTo: [public.data]
        NSAppTransportSecurity:
          # A web browser must load http:// pages; this exempts web content only, not Harbor's own requests.
          NSAllowsArbitraryLoadsInWebContent: true
        CFBundleURLTypes:
          - CFBundleURLName: com.arjunakankipati.harbor.web
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arjunakankipati.harbor
        # XcodeGen otherwise sets iPhone and iPad on the target, overriding the project setting.
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Harbor
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your protected Harbor profiles with Face ID.
        INFOPLIST_KEY_NSCameraUsageDescription: Websites can request camera access for calls or capturing photos.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Websites can request microphone access for calls or recording audio.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Websites can request your location to show nearby places or directions.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Websites on your local network, such as router or printer pages, can be opened in Harbor.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save images and videos from websites to your photo library.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: Harbor
        MARKETING_VERSION: 0.1.17
        CURRENT_PROJECT_VERSION: 1
      configs:
        Release:
          # Debug-only UI test fixtures and internal provenance notes.
          EXCLUDED_SOURCE_FILE_NAMES: browser-fixture.html media-fixture.mp4 ASSET-PROVENANCE.md
  HarborTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HarborTests]
    dependencies:
      - target: Harbor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  HarborUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HarborUITests]
    dependencies:
      - target: Harbor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Harbor:
    build:
      targets:
        Harbor: all
    test:
      targets: [HarborTests, HarborUITests]
