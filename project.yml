name: Harbor
options:
  bundleIdPrefix: com.arjunakankipati.harbor
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 'TDBAHN96B3'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Harbor:
    type: application
    platform: iOS
    sources:
      - path: Harbor
      - path: assets/HarborIcon/Harbor.icon
    info:
      path: Harbor/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.arjunakankipati.harbor.tab-reorder
            UTTypeConformsTo: [public.data]
        CFBundleURLTypes:
          - CFBundleURLName: com.arjunakankipati.harbor.web
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arjunakankipati.harbor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Harbor
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your protected Harbor profiles with Face ID.
        INFOPLIST_KEY_NSCameraUsageDescription: Websites can request camera access for calls or capturing photos.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Websites can request microphone access for calls or recording audio.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: Harbor
        MARKETING_VERSION: 0.1.10
        CURRENT_PROJECT_VERSION: 1
  HarborTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HarborTests]
    dependencies:
      - target: Harbor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  HarborUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HarborUITests]
    dependencies:
      - target: Harbor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Harbor:
    build:
      targets:
        Harbor: all
    test:
      targets: [HarborTests, HarborUITests]
