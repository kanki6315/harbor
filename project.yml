name: Harbor
options:
  bundleIdPrefix: com.harbor
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Harbor:
    type: application
    platform: iOS
    sources:
      - path: Harbor
      - path: assets/HarborIcon/Harbor.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harbor.browser
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Harbor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: Harbor
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
  HarborTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HarborTests]
    dependencies:
      - target: Harbor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  HarborUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HarborUITests]
    dependencies:
      - target: Harbor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Harbor:
    build:
      targets:
        Harbor: all
    test:
      targets: [HarborTests, HarborUITests]
